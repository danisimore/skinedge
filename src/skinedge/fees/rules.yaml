      steamdb: площадка за вывод не берёт, платёжный процессор удерживает 1–5% в
      зависимости от способа; csdb.gg: 5% за вывод на карту. Берём худший случай,
      проверить в аккаунте

  # ---------- Lis-Skins ----------
  - id: lisskins.buy
    marketplace: lisskins
    operation: buy
    kind: percent
