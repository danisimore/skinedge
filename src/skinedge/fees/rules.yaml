  # ---------- Market.CSGO ----------
  # Для Dota 2 (market.dota2.net) и Rust (rust.tm) отдельных данных нет:
  # считаем, что комиссии те же, что на market.csgo.com.
  - id: marketcsgo.buy
    marketplace: marketcsgo
    operation: buy
    kind: percent
    rate: "0"
    currency: EUR
    verification: third_party
    source: "https://steamdb.com/ru/markets/csgotm"
    verified_at: 2026-07-02

  - id: marketcsgo.sell
    marketplace: marketcsgo
    operation: sell
    kind: percent
    rate: "0.05"
    currency: EUR
    verification: third_party
    source: "https://steamdb.com/ru/markets/csgotm"
    verified_at: 2026-07-02
    note: "5% с проданного предмета; по csdb.gg ставка одна для всех и не снижается"

  - id: marketcsgo.deposit.any
    marketplace: marketcsgo
    operation: deposit
    kind: percent
    rate: "0"
    currency: EUR
    verification: unknown
    note: "Комиссии пополнения не найдены"

  - id: marketcsgo.withdraw.card
    marketplace: marketcsgo
    operation: withdraw
    method: card
    kind: percent
    rate: "0.05"
    currency: EUR
    verification: third_party
    source: "https://steamdb.com/ru/markets/csgotm"
    verified_at: 2026-07-02
