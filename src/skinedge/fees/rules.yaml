    currency: USD
    verification: third_party
    source: "https://steamdb.com/ru/markets/lis-skins"
    verified_at: 2026-07-02
    note: "Комиссия покупателя 0%; csdb.gg тоже пишет, что с покупателя не берут"

  - id: lisskins.deposit.any
    marketplace: lisskins
    operation: deposit
    kind: percent
    rate: "0"
    currency: USD
    verification: third_party
    source: "https://steamdb.com/ru/markets/lis-skins"
    verified_at: 2026-07-02
    note: "Комиссий за пополнение нет (карта, криптовалюта)"

  # ---------- Steam Community Market ----------
  - id: steam.buy
    marketplace: steam
    operation: buy
    kind: percent
    rate: "0"
    currency: EUR
    verification: third_party
    source: "https://csdb.gg/trading-site/steam/"
    note: "Комиссии уже включены в цену, которую видит покупатель"

  - id: steam.sell.cs2
    marketplace: steam
    operation: sell
    kind: steam
    currency: EUR
    rounding: floor
    extra:
      steam_rate: "0.05"
      game_rate: "0.10"
    verification: third_party
    source: "https://csdb.gg/trading-site/steam/"
    note: "5% Steam (мин. 0.01) + 10% CS2 (мин. 0.01) от суммы, которую получает продавец"
